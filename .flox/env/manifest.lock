    "schema-version": "1.16.0",
    "install": {
      "nodejs_24": {
        "pkg-path": "nodejs_24"
      },
      "python312": {
        "pkg-path": "python312"
      },
      "util-linux": {
        "pkg-path": "util-linux",
        "outputs": [
          "bin",
          "lib"
        ]
      }
    },
    "vars": {
      "NODE_OPTIONS": "--no-experimental-strip-types"
    },
    "hook": {
      "on-activate": "  # Sibling checkouts, at the paths upstream's scripts default to.\n  export WORKBENCH=\"$FLOX_ENV_PROJECT\"\n  export EUCLID_REPO=\"$(cd \"$WORKBENCH/..\" && pwd)/euclid\"\n  export EUCLIDS_GEOMLIB_REPO=\"$EUCLID_REPO\"\n  export EUCLIDS_REPO=\"$(cd \"$WORKBENCH/..\" && pwd)/euclids-elements.org\"\n  export LEKTOR_REPO=\"$(cd \"$WORKBENCH/..\" && pwd)/euclids-elements-lektor\"\n\n  # The prebuilt canvas.node links libuuid; nix-built node uses the normal\n  # loader, so LD_LIBRARY_PATH is the knob (NIX_LD_LIBRARY_PATH is not).\n  export LD_LIBRARY_PATH=\"$FLOX_ENV/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}\"\n\n  # check-decks.js resolves node-canvas from the euclid checkout.\n  export NODE_PATH=\"$EUCLID_REPO/node_modules\"\n\n  # Lektor lives in a venv inside the workbench (gitignored), pinned to the\n  # content repo's requirements.txt so the two can't drift.\n  VENV=\"$WORKBENCH/.venv\"\n  REQ=\"$LEKTOR_REPO/requirements.txt\"\n  if [ -f \"$REQ\" ]; then\n    if [ ! -x \"$VENV/bin/lektor\" ] || ! cmp -s \"$REQ\" \"$VENV/.requirements.txt\"; then\n      python3 -m venv \"$VENV\" >/dev/null\n      \"$VENV/bin/pip\" install -q -r \"$REQ\" && cp \"$REQ\" \"$VENV/.requirements.txt\"\n    fi\n    export PATH=\"$VENV/bin:$PATH\"\n  fi\n"
    },
    "profile": {},
    "options": {
      "systems": [
        "x86_64-linux",
        "aarch64-linux",
        "aarch64-darwin",
        "x86_64-darwin"
      ]
    }
  },
